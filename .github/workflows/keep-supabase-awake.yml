name: Keep Supabase awake

# Free Supabase projects are paused after a week without activity, which would break
# live rooms. This asks the database for the time every 3 days (and can be run by hand
# from the Actions tab). It only uses the publishable key, which is already public in
# memory-poker/js/config.js.
#
# Note: GitHub turns off scheduled jobs in a repo with no commits for 60 days and emails
# you first. If that happens, open Actions -> "Keep Supabase awake" -> Enable workflow.

on:
  schedule:
    - cron: '17 15 */3 * *'   # every 3 days, 15:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask Supabase for the time
        run: |
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" memory-poker/js/config.js)
          KEY=$(grep -oE "sb_publishable_[A-Za-z0-9_-]+" memory-poker/js/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "No Supabase settings in config.js; nothing to do."; exit 0; fi
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/server_now" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo
